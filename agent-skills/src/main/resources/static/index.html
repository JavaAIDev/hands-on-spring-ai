<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copywriting Assistant</title>
  <style>
    :root {
      color: #1d2a2e;
      background: #f4f7f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(680px, calc(100% - 32px));
      padding: 32px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 14px 40px rgb(23 45 37 / 12%);
    }

    h1 { margin: 0; font-size: 1.75rem; }
    p { color: #52615c; line-height: 1.5; }
    label { display: block; margin: 24px 0 8px; font-weight: 650; }

    textarea, button {
      box-sizing: border-box;
      width: 100%;
      border-radius: 10px;
      font: inherit;
    }

    textarea {
      min-height: 132px;
      padding: 12px;
      border: 1px solid #b9c5be;
      resize: vertical;
    }

    textarea:focus { border-color: #15755b; outline: 3px solid #d9f0e7; }

    button {
      margin-top: 14px;
      padding: 12px 18px;
      border: 0;
      background: #15755b;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover:not(:disabled) { background: #0c5d46; }
    button:disabled { cursor: wait; opacity: .65; }

    .result {
      min-height: 72px;
      margin-top: 24px;
      padding: 16px;
      border-radius: 10px;
      background: #f0f5f2;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .error { color: #a32626; }
  </style>
</head>
<body>
  <main>
    <h1>Copywriting Assistant</h1>
    <p>Describe your goal, audience, and channel to generate tailored marketing copy.</p>

    <form id="task-form">
      <label for="task">Task</label>
      <textarea id="task" name="task" placeholder="Example: Write a concise product-launch email for a project management app aimed at small design teams." required></textarea>
      <button id="submit-button" type="submit">Run</button>
    </form>

    <section aria-live="polite">
      <label for="result">Result</label>
      <div id="result" class="result">Enter a task, then select Run.</div>
    </section>
  </main>

  <script>
    const form = document.querySelector('#task-form');
    const task = document.querySelector('#task');
    const button = document.querySelector('#submit-button');
    const result = document.querySelector('#result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const taskValue = task.value.trim();
      if (!taskValue) return;

      button.disabled = true;
      button.textContent = 'Running…';
      result.classList.remove('error');
      result.textContent = 'Generating copy…';

      try {
        const response = await fetch('/copywriting/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task: taskValue })
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.message || 'The request could not be completed.');
        result.textContent = body.response || 'No result was returned.';
      } catch (error) {
        result.classList.add('error');
        result.textContent = `Request failed: ${error.message}`;
      } finally {
        button.disabled = false;
        button.textContent = 'Run';
      }
    });
  </script>
</body>
</html>
