spring:
  application:
    name: web-page-qa
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo}
      chat:
        enabled: true
        options:
          model: gpt-5.6-luna
      embedding:
        enabled: true
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initializeSchema: true
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres